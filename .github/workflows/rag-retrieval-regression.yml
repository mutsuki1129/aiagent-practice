name: rag-retrieval-regression

on:
  pull_request:
    branches: ["**"]
  push:
    branches: ["main", "master"]

jobs:
  retrieval-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CHROMA_PERSIST_DIR: ./.tmp/chroma_ci
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check
        run: |
          python -m py_compile app.py config.py rag/vector_store.py rag_retrieval_eval.py rag_retrieval_regression.py

      - name: Run retrieval regression (CI cases)
        run: |
          python rag_retrieval_regression.py \
            --cases docs/retrieval_eval_cases.ci.json \
            --baseline docs/retrieval_baseline.ci.json \
            --report reports/rag_retrieval_latest_ci.json \
            --k 6 \
            --max-recall-drop 0.00 \
            --max-mrr-drop 0.00 \
            --max-error-cases 0

      - name: Upload regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-retrieval-report
          path: reports/rag_retrieval_latest_ci.json
          if-no-files-found: warn
